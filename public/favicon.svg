<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="cabinWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="roofSnow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Circle Background -->
  <circle cx="50" cy="50" r="48" fill="url(#skyGrad)" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Stars / Snowflakes -->
  <circle cx="22" cy="24" r="1.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="78" cy="22" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="35" cy="18" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="68" cy="36" r="1.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="16" cy="42" r="1" fill="#ffffff" opacity="0.6"/>

  <!-- Pine Tree Left -->
  <polygon points="26,68 18,68 22,54" fill="#065f46"/>
  <polygon points="25,58 19,58 22,46" fill="#047857"/>
  <polygon points="24,49 20,49 22,40" fill="#10b981"/>

  <!-- Cozy Log Cabin Body -->
  <rect x="36" y="52" width="38" height="28" rx="2" fill="url(#cabinWall)" stroke="#451a03" stroke-width="1.5"/>

  <!-- Warm Glowing Window -->
  <rect x="42" y="58" width="14" height="14" rx="2" fill="#fde047" filter="url(#glow)"/>
  <line x1="49" y1="58" x2="49" y2="72" stroke="#78350f" stroke-width="1.5"/>
  <line x1="42" y1="65" x2="56" y2="65" stroke="#78350f" stroke-width="1.5"/>

  <!-- Cozy Red Door -->
  <rect x="60" y="60" width="10" height="20" rx="1.5" fill="#dc2626"/>
  <circle cx="68" cy="70" r="1" fill="#fef08a"/>

  <!-- Snow on Roof -->
  <polygon points="32,54 55,30 78,54" fill="#991b1b"/>
  <path d="M 30,54 Q 37,56 42,54 Q 48,56 55,30 Q 62,56 68,54 Q 74,56 80,54 Q 82,49 78,48 L 55,27 L 32,48 Z" fill="url(#roofSnow)"/>

  <!-- Chimney and Smoke -->
  <rect x="63" y="32" width="6" height="14" fill="#78350f"/>
  <path d="M 66,28 Q 69,24 67,20 Q 64,16 68,12" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Snowy Ground -->
  <ellipse cx="50" cy="88" rx="46" ry="14" fill="#f8fafc"/>
  <ellipse cx="30" cy="84" rx="20" ry="8" fill="#e2e8f0" opacity="0.6"/>

  <!-- Golden Advent Star on top of roof -->
  <polygon points="55,20 57,25 62,25 58,28 60,33 55,30 50,33 52,28 48,25 53,25" fill="#f59e0b" filter="url(#glow)"/>
</svg>
